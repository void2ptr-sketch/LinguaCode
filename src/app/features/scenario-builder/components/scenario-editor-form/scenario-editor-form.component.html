<section class="scenario-editor-form">
  @if (readOnly()) {
    <p class="scenario-editor-form__readonly">Чужой сценарий — только просмотр.</p>
  }

  <mat-tab-group class="scenario-editor-form__tabs" dynamicHeight>
    <!-- ── Вкладка 1: Основное ── -->
    <mat-tab label="Основное">
      <div class="scenario-editor-form__tab-panel">
        <mat-form-field appearance="outline">
          <mat-label>Название</mat-label>
          <input
            matInput
            [disabled]="readOnly()"
            [ngModel]="draft().title"
            (ngModelChange)="updateDraft({ title: $event })"
          />
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Описание</mat-label>
          <textarea
            matInput
            rows="3"
            [disabled]="readOnly()"
            [ngModel]="draft().description"
            (ngModelChange)="updateDraft({ description: $event })"
          ></textarea>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Порядок</mat-label>
          <input
            matInput
            type="number"
            [disabled]="readOnly()"
            min="1"
            [ngModel]="draft().scenarioOrder ?? 1"
            (ngModelChange)="updateScenarioOrder($event)"
          />
          <mat-hint>Позиция сценария внутри урока</mat-hint>
          @if (scenarioOrderInvalid()) {
            <mat-error>Порядок должен быть ≥ 1</mat-error>
          }
        </mat-form-field>
      </div>
    </mat-tab>

    <!-- ── Вкладка 2: Размещение ── -->
    <mat-tab label="Размещение">
      <div class="scenario-editor-form__tab-panel">
        <app-content-hierarchy-selector
          [levels]="hierarchyLevels"
          [value]="hierarchyValue()"
          [readOnly]="readOnly()"
          (valueChange)="onHierarchyChange($event)"
        />
      </div>
    </mat-tab>

    <!-- ── Вкладка 3: Публикация ── -->
    <mat-tab label="Публикация">
      <div class="scenario-editor-form__tab-panel">
        @if (!readOnly()) {
          <mat-checkbox [ngModel]="draft().published" (ngModelChange)="updatePublished($event)">
            Опубликовать
          </mat-checkbox>
        }

        <mat-form-field appearance="outline">
          <mat-label>Уровень доступа</mat-label>
          <mat-select
            [disabled]="readOnly()"
            [ngModel]="draft().requiredTier"
            (ngModelChange)="onRequiredTierChange($event)"
          >
            @for (tier of tierOptions; track tier) {
              <mat-option [value]="tier">{{ tierLabels[tier] }}</mat-option>
            }
          </mat-select>
        </mat-form-field>

        <!-- Placeholder for future card source mode UI -->
        <!-- <ng-content select="[card-source-mode]" /> -->
      </div>
    </mat-tab>
  </mat-tab-group>
</section>
