<mat-card class="page-card">
  <mat-card-header>
    <mat-card-title>Каталог курсов</mat-card-title>
    <mat-card-subtitle>Управление языковыми парами и настройками обучения</mat-card-subtitle>
  </mat-card-header>

  <mat-card-content class="page-card__content">
    <mat-tab-group
      class="page-card__tabs"
      dynamicHeight
      [selectedIndex]="selectedTabIndex()"
      (selectedIndexChange)="selectedTabIndex.set($event)"
    >
      <!-- Tab: Курсы -->
      <mat-tab label="Курсы">
        <app-course-catalog-courses
          [displayName]="displayName()"
          [preferences]="preferences()"
          [languagePairs]="languagePairs()"
          [activeLanguagePairId]="activeLanguagePairId()"
          [nameDraft]="nameDraft()"
          [learningProficiencyDraft]="learningProficiencyDraft()"
          [themeDraft]="themeDraft()"
          [fontSizeDraft]="fontSizeDraft()"
          [colorSchemeDraft]="colorSchemeDraft()"
          [cardFocusFullscreenDraft]="cardFocusFullscreenDraft()"
          [knownLanguageDraft]="knownLanguageDraft()"
          [learningLanguageDraft]="learningLanguageDraft()"
          (knownLanguageChange)="knownLanguageDraft.set($event)"
          (learningLanguageChange)="learningLanguageDraft.set($event)"
          (addPair)="addPair()"
          (setActive)="setActive($event)"
          (removePair)="removePair($event)"
        />
      </mat-tab>

      <!-- Tab: Настройка курса -->
      <mat-tab label="Настройка курса">
        <app-course-catalog-settings
          [languagePairs]="languagePairs()"
          [activeLanguagePairId]="activeLanguagePairId()"
          [displayRomanizationsDraft]="displayRomanizationsDraft()"
          [answerRomanizationsDraft]="answerRomanizationsDraft()"
          [showIpaDraft]="showIpaDraft()"
          [ipaVariantLabelDraft]="ipaVariantLabelDraft()"
          [answerModesDraft]="answerModesDraft()"
          [toneColorEnabledDraft]="toneColorEnabledDraft()"
          [toneColorSchemeDraft]="toneColorSchemeDraft()"
          [tracingStrokeDurationDraft]="tracingStrokeDurationDraft()"
          [romanizationOptions]="romanizationOptions()"
          [showCjkPreferences]="showCjkPreferences()"
          [showPhoneticPreferences]="showPhoneticPreferences()"
          [showTracingSettings]="showTracingSettings()"
          (displayRomanizationsChange)="displayRomanizationsDraft.set($event)"
          (answerRomanizationsChange)="answerRomanizationsDraft.set($event)"
          (showIpaChange)="showIpaDraft.set($event)"
          (ipaVariantLabelChange)="ipaVariantLabelDraft.set($event)"
          (answerModesChange)="answerModesDraft.set($event)"
          (toneColorEnabledChange)="toneColorEnabledDraft.set($event)"
          (toneColorSchemeChange)="toneColorSchemeDraft.set($event)"
          (tracingStrokeDurationChange)="tracingStrokeDurationDraft.set($event)"
        />
      </mat-tab>

      <!-- Tab: Программы курса -->
      <mat-tab label="Программы курса">
        <app-course-catalog-programs
          [loading]="loading()"
          [error]="error()"
          [items]="items()"
          [totalItems]="totalItems()"
          [pageIndex]="pageIndex()"
          [pageSize]="pageSize()"
          [progressByCourseId]="progressByCourseId()"
          [completedCourseIds]="completedCourseIds()"
          (loadRequested)="load()"
          (pageChange)="onPageChange($event)"
          (startCourse)="startCourse($event)"
        />
      </mat-tab>
    </mat-tab-group>
  </mat-card-content>

  <mat-card-actions align="end">
    <button mat-flat-button type="button" (click)="saveProfile()">Сохранить</button>
  </mat-card-actions>
</mat-card>
