<mat-card class="page-card">
  <mat-card-header>
    <mat-card-title>Каталог курсов</mat-card-title>
    <mat-card-subtitle>Управление языковыми парами и настройками обучения</mat-card-subtitle>
  </mat-card-header>

  <mat-card-content class="page-card__content">
    <mat-tab-group
      class="page-card__tabs"
      dynamicHeight
      [selectedIndex]="selectedTabIndex()"
      (selectedIndexChange)="catalogStore.setSelectedTabIndex($event)"
    >
      <!-- Tab: Курсы -->
      <mat-tab label="Курсы">
        @if (coursesComponent()) {
          <ng-container *ngComponentOutlet="coursesComponent()"></ng-container>
        } @else {
          <p class="page-card__hint">Загрузка...</p>
        }
      </mat-tab>

      <!-- Tab: Настройка курса -->
      <mat-tab label="Настройка курса">
        @if (settingsComponent()) {
          <ng-container *ngComponentOutlet="settingsComponent()"></ng-container>
        } @else {
          <p class="page-card__hint">Загрузка...</p>
        }
      </mat-tab>

      <!-- Tab: Программы курса -->
      <mat-tab label="Программы курса">
        @if (programsComponent()) {
          <ng-container *ngComponentOutlet="programsComponent()"></ng-container>
        } @else {
          <p class="page-card__hint">Загрузка...</p>
        }
      </mat-tab>
    </mat-tab-group>
  </mat-card-content>

  <mat-card-actions align="end">
    <button mat-flat-button type="button" (click)="saveProfile()">Сохранить</button>
  </mat-card-actions>
</mat-card>
