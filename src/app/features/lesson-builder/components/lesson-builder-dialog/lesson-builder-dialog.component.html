<h2 mat-dialog-title>{{ title() }}</h2>

<mat-dialog-content>
  @if (store.editorLoading()) {
    <div class="lesson-builder-dialog__state">
      <mat-spinner diameter="36" />
    </div>
  } @else {
    @if (store.error()) {
      <p class="lesson-builder-dialog__error">{{ store.error() }}</p>
    }

    <app-lesson-form
      [draft]="draft()"
      [candidateLessons]="store.candidateLessons()"
      [readOnly]="store.isReadOnly()"
      [languagePairs]="languagePairs()"
      [courses]="courses()"
      [programs]="programs()"
      (draftChange)="updateDraft($event)"
    />
  }
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="cancel()">Отмена</button>
  @if (!store.isReadOnly()) {
    <button mat-flat-button type="button" [disabled]="!dirty()" (click)="saveLesson()">
      Сохранить
    </button>
  }
</mat-dialog-actions>
