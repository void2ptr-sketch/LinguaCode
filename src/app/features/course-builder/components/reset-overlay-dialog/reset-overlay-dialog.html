<h2 mat-dialog-title>Сброс пользовательских данных</h2>

<mat-dialog-content>
  <p>
    Вы собираетесь удалить все пользовательские изменения из локального хранилища.
    Будет удалено <strong>{{ data.itemCount }} элементов</strong> (курсы, программы, уроки, сценарии, карточки).
  </p>
  <p>После сброса будут загружены только системные seed-данные.</p>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-stroked-button type="button" (click)="onCancel()">Отмена</button>
  <button mat-flat-button color="warn" type="button" (click)="onConfirm()">Сбросить</button>
</mat-dialog-actions>
