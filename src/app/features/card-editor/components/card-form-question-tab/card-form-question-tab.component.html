<p class="card-form__hint card-form__hint--tab">
  <strong>Заголовок</strong> - для группировки вопросов.
</p>
<mat-form-field appearance="outline">
  <mat-label>Заголовок</mat-label>
  <input matInput [ngModel]="draft().title" (ngModelChange)="updateTitle($event)" />
</mat-form-field>

@if (choiceDraft(); as choice) {
  <mat-form-field appearance="outline">
    <mat-label>{{
      choice.kind === 'reading'
        ? 'Контекст (известный)'
        : choice.kind === 'tone'
          ? 'Подсказка'
          : 'Вопрос'
    }}</mat-label>
    <textarea
      matInput
      rows="4"
      [ngModel]="choice.promptKnown"
      (ngModelChange)="updateChoicePromptKnown($event)"
    ></textarea>
  </mat-form-field>
}
