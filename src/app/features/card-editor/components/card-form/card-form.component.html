<div class="card-form">
  <div class="card-form__main">
    <!-- Tab Navigation -->
    <app-card-form-tabs [tabs]="tabs()" (activeTabChange)="onTabChange($event)" />

    <!-- Tab Content -->
    <div class="card-form__tab-content">
      @switch (activeTabId()) {
        @case ('content') {
          <app-card-form-content-tab
            [draft]="draft()"
            [knownLanguage]="knownLanguage()"
            [learningLanguage]="learningLanguage()"
            (draftChange)="updateDraft($event)"
          />
        }
        @case ('answers') {
          <app-card-form-answers-tab
            [draft]="draft()"
            [knownLanguage]="knownLanguage()"
            [learningLanguage]="learningLanguage()"
            (draftChange)="updateDraft($event)"
          />
        }
        @case ('appearance') {
          <app-card-form-appearance-tab [draft]="draft()" (draftChange)="updateDraft($event)" />
        }
        @case ('placement') {
          <app-card-form-placement-tab
            [draft]="{
              courseId: draft().courseId,
              programId: draft().programId,
              lessonId: draft().lessonId,
              scenarioId: draft().scenarioId,
            }"
            [availableCourses]="availableCourses()"
            [availablePrograms]="availablePrograms()"
            [availableLessons]="availableLessons()"
            [availableScenarios]="availableScenarios()"
            (courseIdChange)="updateCourseId($event)"
            (programIdChange)="updateProgramId($event)"
            (lessonIdChange)="updateLessonId($event)"
            (scenarioIdChange)="updateScenarioId($event)"
          />
        }
        @case ('publishing') {
          <app-card-form-publishing-tab
            [meta]="meta()"
            (metaChange)="metaChange.emit($event)"
          />
        }
      }
    </div>
  </div>

  <app-card-preview [card]="previewCard()" [fontSize]="previewFontSize()" />
</div>
