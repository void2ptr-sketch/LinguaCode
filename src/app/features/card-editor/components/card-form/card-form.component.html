<div class="card-form" [class.card-form--preview-hidden]="!showPreview()">
  <!-- Tab Navigation: spans the full dialog width -->
  <app-card-form-tabs [tabs]="tabs()" (activeTabChange)="onTabChange($event)" />

  <div class="card-form__main">
    <!-- Tab Content -->
    <div #tabContent class="card-form__tab-content">
      @switch (activeTabId()) {
        @case ('content') {
          <app-card-form-content-tab
            [draft]="draft()"
            [knownLanguage]="knownLanguage()"
            [learningLanguage]="learningLanguage()"
            (draftChange)="updateDraft($event)"
          />
        }
        @case ('answers') {
          <app-card-form-answers-tab
            [draft]="draft()"
            [knownLanguage]="knownLanguage()"
            [learningLanguage]="learningLanguage()"
            (draftChange)="updateDraft($event)"
          />
        }
        @case ('appearance') {
          <app-card-form-appearance-tab [draft]="draft()" (draftChange)="updateDraft($event)" />
        }
        @case ('placement') {
          <app-card-form-placement-tab
            [draft]="placementValue()"
            [languagePairId]="resolvedLanguagePairId()"
            (placementChange)="onPlacementChange($event)"
          />
        }
        @case ('publishing') {
          <app-card-form-publishing-tab [meta]="meta()" (metaChange)="metaChange.emit($event)" />
        }
      }
    </div>
  </div>

  @if (showPreview()) {
    <app-card-preview [card]="previewCard()" [fontSize]="previewFontSize()" />
  }
</div>
