<div class="card-form">
  <div class="card-form__main">
    <!-- Tab Navigation -->
    <app-card-form-tabs [tabs]="allAvailableTabs" (activeTabChange)="onTabChange($event)" />

    <!-- Tab Content -->
    <div class="card-form__tab-content">
      @switch (activeTabIndex()) {
        @case (0) {
          <app-card-form-question-tab
            [availableCourses]="availableCourses()"
            [availablePrograms]="availablePrograms()"
            [availableLessons]="availableLessons()"
            [availableScenarios]="availableScenarios()"
            [draft]="draft()"
            [knownLanguage]="knownLanguage()"
            [learningLanguage]="learningLanguage()"
            (knownLanguageChange)="onKnownLanguageChange($event)"
            (learningLanguageChange)="onLearningLanguageChange($event)"
            (courseIdChange)="updateCourseId($event)"
            (programIdChange)="updateProgramId($event)"
            (lessonIdChange)="updateLessonId($event)"
            (scenarioIdChange)="updateScenarioId($event)"
            (titleChange)="updateTitle($event)"
            (choicePromptKnownChange)="updateChoicePromptKnown($event)"
          />
        }
        @case (1) {
          <app-card-form-answers-tab
            [draft]="draft()"
            [knownLanguage]="knownLanguage()"
            [learningLanguage]="learningLanguage()"
            (draftChange)="updateDraft($event)"
          />
        }
        @case (2) {
          <p class="card-form__hint card-form__hint--tab">Варианты ответов и правильный ответ.</p>
          <app-card-options-editor
            [config]="choiceOptionsConfig()"
            [options]="choiceOptionTexts()"
            [lexemes]="choiceOptionLexemes()"
            [correctIndex]="choiceDraft() ? choiceDraft()!.correctIndex : 0"
            [showLexemes]="true"
            [knownLanguage]="knownLanguage()"
            [learningLanguage]="learningLanguage()"
            (stateChange)="onChoiceOptionsStateChange($event)"
          />
        }
        @case (3) {
          <p class="card-form__hint card-form__hint--tab">Лексемы, IPA, пиньинь, URL аудио.</p>
          <app-card-form-phonetics-panel
            [draft]="draft()"
            [knownLanguage]="knownLanguage()"
            [learningLanguage]="learningLanguage()"
            (draftChange)="updateDraft($event)"
          />
        }
        @case (4) {
          <p class="card-form__hint card-form__hint--tab">Дополнительная информация о карточке.</p>
          <app-card-meta-fields [meta]="meta()" (metaChange)="metaChange.emit($event)" />
        }
        @case (5) {
          <p class="card-form__hint card-form__hint--tab">Тема, шрифт, лимит времени и режимы.</p>
          <app-card-form-settings-panel [draft]="draft()" (draftChange)="updateDraft($event)" />
        }
        @case (6) {
          <app-card-connections-tab
            [draft]="{ courseId: draft().courseId, programId: draft().programId, lessonId: draft().lessonId, scenarioId: draft().scenarioId }"
            [meta]="meta()"
            (courseIdChange)="updateCourseId($event)"
            (programIdChange)="updateProgramId($event)"
            (lessonIdChange)="updateLessonId($event)"
            (scenarioIdChange)="updateScenarioId($event)"
            (languagePairIdChange)="metaChange.emit({ ...meta(), languagePairId: $event })"
          />
        }
      }
    </div>
  </div>

  <app-card-preview [card]="previewCard()" [fontSize]="previewFontSize()" />
</div>
