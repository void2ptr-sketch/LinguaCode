@if (meta(); as m) {
  <section class="card-meta-fields">
    <h3>Публикация</h3>

    <mat-form-field appearance="outline">
      <mat-label>Сложность</mat-label>
      <mat-select [ngModel]="m.difficulty" (ngModelChange)="updateDifficulty($event)">
        @for (difficulty of difficultyOptions(); track difficulty) {
          <mat-option [value]="difficulty">{{ difficultyLabels()[difficulty] }}</mat-option>
        }
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Теги (через запятую)</mat-label>
      <input matInput [ngModel]="tagsString()" (ngModelChange)="updateTags($event)" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Уровень доступа</mat-label>
      <mat-select [ngModel]="m.requiredTier ?? 'FREE'" (ngModelChange)="updateRequiredTier($event)">
        @for (tier of tierOptions; track tier) {
          <mat-option [value]="tier">{{ tierLabels[tier] }}</mat-option>
        }
      </mat-select>
    </mat-form-field>

    <mat-checkbox [ngModel]="m.published ?? true" (ngModelChange)="updatePublished($event)">
      Опубликована
    </mat-checkbox>
  </section>
}
