@if (showPromptLexeme() && promptLexemeDraft(); as d) {
  <app-lexeme-fields
    [label]="d.kind === 'draw' ? 'Лексема (иероглиф)' : 'Подсказка (лексема)'"
    [fields]="d.promptLexeme"
    [knownLanguage]="knownLanguage()"
    [learningLanguage]="learningLanguage()"
    (fieldsChange)="updatePromptLexeme($event)"
  />

  <mat-form-field appearance="outline">
    <mat-label>URL аудио</mat-label>
    <input matInput [ngModel]="d.audioUrl" (ngModelChange)="updateAudioUrl($event)" />
  </mat-form-field>
}
