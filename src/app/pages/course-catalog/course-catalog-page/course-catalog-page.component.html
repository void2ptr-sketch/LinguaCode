<mat-card class="page-card">
  <mat-card-header>
    <mat-card-title>Каталог курсов</mat-card-title>
    <mat-card-subtitle>Управление языковыми парами и настройками обучения</mat-card-subtitle>
  </mat-card-header>

  <mat-card-content class="page-card__content">
    <mat-tab-group
      class="page-card__tabs"
      dynamicHeight
      [selectedIndex]="selectedTabIndex()"
      (selectedIndexChange)="catalogStore.setSelectedTabIndex($event)"
    >
      <!-- Tab: Курсы -->
      <mat-tab label="Курсы">
        <app-course-catalog-course-list (startCourse)="startCourse($event)" />
      </mat-tab>

      <!-- Tab: Программы курса -->
      <mat-tab label="Программы курса">
        <app-course-catalog-programs
          [courseId]="catalogStore.selectedCourseId()"
          (startProgram)="startCourse($event)"
        />
      </mat-tab>
    </mat-tab-group>
  </mat-card-content>


</mat-card>
