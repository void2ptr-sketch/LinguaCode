<div class="content-explorer-page">
  <header class="content-explorer-page__header">
    <div class="content-explorer-page__heading">
      <h1 class="content-explorer-page__title">
        <mat-icon>account_tree</mat-icon>
        Проводник контента
      </h1>
      <p class="content-explorer-page__subtitle">
        Каталог программ → Трек → Урок → Сценарий → Карточка
      </p>
    </div>
    <button
      mat-flat-button
      type="button"
      class="content-explorer-page__create-course"
      [disabled]="acting()"
      (click)="onCreateCourseRequested()"
    >
      <mat-icon>add</mat-icon>
      Создать курс
    </button>
  </header>

  <div class="content-explorer-page__layout">
    <aside class="content-explorer-page__tree">
      <app-explorer-tree />
    </aside>

    <section class="content-explorer-page__detail">
      <app-explorer-detail
        [acting]="acting()"
        [cardUsages]="cardUsages()"
        [cardUsagesLoading]="cardUsagesLoading()"
        (editRequested)="onEditRequested()"
        (addProgramRequested)="onAddProgramRequested()"
        (addLessonRequested)="onAddLessonRequested()"
        (addScenarioRequested)="onAddScenarioRequested()"
        (showUsagesRequested)="onShowUsagesRequested()"
        (exportPdfRequested)="onExportPdfRequested()"
        (exportPdfWithHintsRequested)="onExportPdfWithHintsRequested()"
        (exportJsonRequested)="onExportJsonRequested()"
        (exportScormRequested)="onExportScormRequested()"
        (deleteRequested)="onDeleteCourseRequested()"
      />
    </section>
  </div>
</div>
